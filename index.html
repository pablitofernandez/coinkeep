<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Coinkeep</title>
<meta name="description" content="Isometric tower defense for the browser: defend the castle and keep every coin.">
<!-- link preview when sharing (crawlers do not run JS, so this stays in English) -->
<meta property="og:title" content="Coinkeep">
<meta property="og:description" content="Isometric tower defense for the browser: defend the castle and keep every coin.">
<meta property="og:image" content="https://pablitofernandez.github.io/coinkeep/title.jpg">
<meta property="og:url" content="https://pablitofernandez.github.io/coinkeep/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/src/style.css">
</head>
<body class="title-mode">
<div id="app"></div>
<div id="hud">
  <div class="hud-left"><span class="coin-icon"></span><span id="hud-coins">0</span></div>
  <div class="hud-center"><div id="hud-wave"></div><div id="hud-sub"></div><div id="hud-cards"></div></div>
  <div class="hud-right"><div id="hud-hp-text">60/60</div><div class="hp-bar"><div id="hud-hp"></div></div></div>
  <div id="loading" data-i18n="loading">Loading…</div>
  <button id="mute" class="hud-btn" data-i18n-attr="aria-label:hud.mute;title:hud.sound">🔊</button>
  <button id="music" class="hud-btn" data-i18n-attr="aria-label:hud.music;title:hud.music">🎵</button>
</div>
<div id="help" data-i18n-html="help"></div>
<div id="joy"><div id="joy-knob"></div></div>
<div id="title" class="hidden">
  <h1 class="logo"><img src="/logo.webp" alt="Coinkeep" width="1200" height="400"></h1>
  <p class="tagline" data-i18n="title.tagline"></p>
  <div class="menu">
    <div class="diff" id="diff" role="radiogroup" data-i18n-attr="aria-label:title.difficulty"></div>
    <div class="menu-row">
      <button class="menu-btn" id="show-board" data-i18n="title.leaderboard"></button>
      <button class="menu-btn" id="show-news"><span data-i18n="title.news"></span><span class="news-dot hidden" id="news-dot"></span></button>
    </div>
  </div>
  <div class="board news hidden" id="news">
    <div class="board-head"><b data-i18n="title.news"></b><span id="news-version"></span><button class="board-close" id="news-close" data-i18n-attr="aria-label:title.close">✕</button></div>
    <div class="news-body" id="news-body"></div>
  </div>
  <div class="board hidden" id="board">
    <div class="board-head"><b data-i18n="title.leaderboard"></b><span id="board-diff"></span><button class="board-close" id="board-close" data-i18n-attr="aria-label:title.close">✕</button></div>
    <ol id="board-list"></ol>
  </div>
  <p class="start" data-i18n="title.start"></p>
  <div class="lang" id="lang" role="radiogroup" data-i18n-attr="aria-label:title.language"></div>
  <p class="byline" data-i18n-html="title.byline"></p>
</div>
<div id="cards" class="hidden">
  <h2 data-i18n="cards.title"></h2>
  <div class="card-hand" id="card-hand"></div>
  <button class="menu-btn" id="card-reroll"></button>
  <p class="card-keys" data-i18n="cards.keys"></p>
</div>
<div id="gameover" class="hidden">
  <h1 data-i18n="over.title"></h1>
  <p id="go-text"></p>
  <form class="go-form hidden" id="go-form" autocomplete="off">
    <input id="go-name" maxlength="16" data-i18n-attr="placeholder:over.name;aria-label:over.name" enterkeyhint="send">
    <button class="menu-btn" id="go-send" type="submit" data-i18n="over.send"></button>
  </form>
  <p class="go-msg" id="go-msg"></p>
  <ol class="go-list" id="go-list"></ol>
  <div class="go-buttons">
    <button class="menu-btn primary" id="go-again" data-i18n="over.again"></button>
    <button class="menu-btn" id="go-menu" data-i18n="over.menu"></button>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
